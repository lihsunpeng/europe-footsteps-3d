<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>石板路上的足跡 3D｜Footprints on Cobblestones</title>

<body>
<div id="stage"></div>
<div id="labels"></div>
<header id="top">
  <div id="title"><span class="t1">石板路上的足跡 3D</span><span class="t2">Footprints on Cobblestones · 2026 希臘・土耳其・義大利・波蘭</span></div>
  <nav id="views" aria-label="導覽 Navigation">
    <button data-v="globe">地球<small>Globe</small></button>
    <button data-v="europe" class="on">歐洲<small>Map</small></button>
    <button data-v="street">石板路<small>Walk</small></button>
    <button id="prev" aria-label="上一站 Previous">◀<small>上一站 Prev</small></button>
    <button id="tour" aria-pressed="false">導覽<small>Tour</small></button>

</header>
<div id="hint">拖曳轉地球・點站點飛過去・雙指縮放<span> Drag · tap a pin · pinch to zoom</span></div>
<aside id="panel" class="folded-none">
  <button id="fold" aria-label="收合／展開 Fold / unfold">▾</button>
  <div id="phead"></div>
  <div id="tabs"></div>
  <div id="body"></div>
</aside>
<div id="lb" hidden>
  <div id="lbbar"><span id="lbt"></span><span id="lbtools"><button id="lbp" aria-label="上一張 Previous">◀</button><button id="lbn" aria-label="下一張 Next">▶</button><button id="lbclose">關閉 Close ✕</button></span></div>
